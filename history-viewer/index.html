<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>近代中国时间轴</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand">
        <h1>近代中国 · 时间轴</h1>
        <p class="sub">1840–1949 · 按月浏览</p>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="搜索事件、人物…" autocomplete="off" />
      </label>
    </div>
  </header>

  <main class="wrap">
    <section class="kpis" id="kpis"></section>

    <section class="card overview">
      <div class="card-head">
        <h2>事件密度</h2>
        <div class="legend" id="legend"></div>
      </div>
      <div class="chart-scroll">
        <div class="chart-box" id="chartBox">
          <svg id="density" role="img" aria-label="1919 到 1949 年每月事件重要度"></svg>
          <div class="tip" id="tip" hidden></div>
        </div>
      </div>
    </section>

    <section class="filters" id="filters"></section>

    <section class="timeline" id="timeline"></section>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-inner" id="drawerBody"></div>
  </aside>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data/events.js"></script>
  <script src="data/events-1840-1918.js"></script>
  <script src="data/lenses.js"></script>
  <script src="data/lenses-1840-1918.js"></script>
  <script src="data/details-extra.js"></script>
  <script src="data/media.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
