<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web3 课程自测</title>
<style>
:root {
  --bg: #f2f4f0;
  --surface: #fbfcf9;
  --surface-2: #e8ece5;
  --ink: #1b2420;
  --muted: #5d6a62;
  --line: #d4dad2;
  --line-strong: #b9c2b9;
  --accent: #2c5f56;
  --accent-ink: #173f38;
  --accent-soft: #dfeae5;
  --on-accent: #ffffff;
  --ok: #2d6a45;
  --ok-soft: #e0eee3;
  --bad: #a03a31;
  --bad-soft: #f4e2df;
  --warn: #83631e;
  --warn-soft: #f2ead3;
  --seal: #ad382c;
  --shadow: 0 1px 2px rgba(27,36,32,.05), 0 10px 30px rgba(27,36,32,.07);
  --radius: 10px;
  --sans: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
  --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131917;
    --surface: #1b2320;
    --surface-2: #242d28;
    --ink: #e5eae4;
    --muted: #a0aca4;
    --line: #323d36;
    --line-strong: #46534b;
    --accent: #82baae;
    --accent-ink: #cfe9e1;
    --accent-soft: #1e322c;
    --on-accent: #10201c;
    --ok: #83c79a;
    --ok-soft: #1c3023;
    --bad: #e18c82;
    --bad-soft: #33201d;
    --warn: #d3b16a;
    --warn-soft: #2f2717;
    --seal: #e08a7c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131917;
  --surface: #1b2320;
  --surface-2: #242d28;
  --ink: #e5eae4;
  --muted: #a0aca4;
  --line: #323d36;
  --line-strong: #46534b;
  --accent: #82baae;
  --accent-ink: #cfe9e1;
  --accent-soft: #1e322c;
  --on-accent: #10201c;
  --ok: #83c79a;
  --ok-soft: #1c3023;
  --bad: #e18c82;
  --bad-soft: #33201d;
  --warn: #d3b16a;
  --warn-soft: #2f2717;
  --seal: #e08a7c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 92px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; }
a { color: var(--accent); }
::selection { background: var(--accent-soft); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar::before {
  content: "";
  display: block;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--seal));
}
.topbar-inner {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 14px max(18px, env(safe-area-inset-left, 0px)) 14px max(18px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand-kicker {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .14em;
  color: var(--muted);
  white-space: nowrap;
}
.brand h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 600;
  letter-spacing: .01em;
  white-space: nowrap;
}
.header-side { display: flex; align-items: center; gap: 16px; min-width: 0; }
.global-progress { width: 220px; min-width: 0; }
.gp-text {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 10px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  margin-bottom: 5px;
  white-space: nowrap;
}
.gp-bar { height: 4px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.gp-bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.theme-btn {
  flex: none;
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
}
.theme-btn:hover { border-color: var(--line-strong); color: var(--ink); }

.shell {
  max-width: 1180px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  gap: 48px;
  padding-block: 30px 80px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}

.sidebar {
  position: sticky;
  top: 92px;
  align-self: start;
  max-height: calc(100vh - 112px);
  overflow: auto;
  padding-right: 4px;
  scrollbar-width: thin;
}
.nav-group { margin-bottom: 18px; }
.nav-group-label {
  margin: 0 0 5px 10px;
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 6px 10px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.nav-item:hover { background: var(--surface-2); }
.nav-item.is-active { background: var(--accent-soft); color: var(--accent-ink); }
.nav-id { flex: none; width: 24px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
.nav-item.is-active .nav-id { color: var(--accent); }
.nav-title {
  flex: 1;
  min-width: 0;
  font-size: 12.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.nav-draft {
  margin-left: 4px;
  padding: 0 3px;
  border: 1px solid var(--line);
  border-radius: 3px;
  font-size: 8px;
  color: var(--muted);
  vertical-align: 1px;
}
.nav-status { flex: none; display: flex; align-items: center; }
.dot { display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
.dot.is-progress { background: var(--warn); }
.pill {
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9px;
  font-variant-numeric: tabular-nums;
}
.pill.good { background: var(--ok-soft); color: var(--ok); }
.pill.mid { background: var(--warn-soft); color: var(--warn); }
.pill.low { background: var(--bad-soft); color: var(--bad); }
.sidebar-foot { margin-top: 10px; padding: 14px 10px 0; border-top: 1px solid var(--line); }
.linkbtn {
  padding: 0;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 11px;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.linkbtn:hover { color: var(--bad); }
.hint { margin: 8px 0 0; font-size: 10.5px; line-height: 1.55; color: var(--muted); }

#main { min-width: 0; max-width: 800px; }
.mobile-picker { display: none; align-items: center; gap: 10px; margin-bottom: 18px; }
.mobile-picker label { font-size: 10px; letter-spacing: .1em; color: var(--muted); }
.mobile-picker select {
  flex: 1;
  min-width: 0;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
}

.module-head { padding-bottom: 22px; border-bottom: 1px solid var(--line-strong); }
.eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.eyebrow .sep { color: var(--line-strong); }
.badge {
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  font-family: var(--sans);
  font-size: 9.5px;
  letter-spacing: .02em;
  text-transform: none;
}
.badge.draft { background: var(--warn-soft); color: var(--warn); }
.module-head h2 {
  margin: 12px 0 8px;
  font-family: var(--serif);
  font-size: clamp(28px, 4vw, 40px);
  line-height: 1.18;
  font-weight: 600;
  letter-spacing: -.01em;
  text-wrap: balance;
}
.lede { margin: 0; max-width: 62ch; color: var(--muted); font-size: 14.5px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 7px 18px; margin-top: 15px; font-size: 11.5px; color: var(--muted); }
.meta-row b { color: var(--ink); font-weight: 600; }
.source-note { margin: 13px 0 0; font-size: 11.5px; color: var(--muted); }
.source-note a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }

.score-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 20px;
  margin: 24px 0 6px;
  padding: 20px 22px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  scroll-margin-top: 92px;
}
.score-card::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--seal);
}
.seal {
  flex: none;
  width: 62px;
  height: 62px;
  display: grid;
  place-items: center;
  border: 2px solid var(--seal);
  border-radius: 50%;
  color: var(--seal);
  font-family: var(--serif);
  font-size: 14px;
  letter-spacing: .08em;
  transform: rotate(-8deg);
}
.score-body { flex: 1; min-width: 0; }
.score-line { display: flex; align-items: baseline; gap: 6px; }
.score-num {
  font-family: var(--serif);
  font-size: 40px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.score-den { color: var(--muted); font-size: 12px; }
.score-sub { margin: 6px 0 0; font-size: 11.5px; color: var(--muted); }
.score-bar { height: 5px; margin-top: 11px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.score-bar span { display: block; height: 100%; background: var(--seal); border-radius: 999px; transition: width .4s; }
.score-note { margin: 7px 0 0; font-size: 10.5px; color: var(--muted); }

.section { margin-top: 32px; }
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 2px;
}
.section-head h3 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
.section-head span { font-family: var(--mono); font-size: 10px; color: var(--muted); }

.q {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  gap: 16px;
  padding: 22px 0 24px;
  border-bottom: 1px solid var(--line);
}
.q:last-child { border-bottom: 0; }
.q-label { padding-top: 2px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.q-main { min-width: 0; }
.q-meta { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.stars { color: var(--warn); font-size: 11px; letter-spacing: .08em; }
.type-tag {
  padding: 1px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 9.5px;
  color: var(--muted);
}
.q-prompt {
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.8;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.q-prompt code {
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: .86em;
}
.formula {
  display: block;
  margin: 9px 0;
  padding: 9px 12px;
  border-left: 2px solid var(--line-strong);
  background: var(--surface);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  white-space: normal;
  overflow-x: auto;
}
.formula b { font-weight: 600; }

.opts { display: flex; flex-direction: column; gap: 8px; margin: 13px 0 0; padding: 0; border: 0; min-width: 0; }
.opt {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.opt:hover { border-color: var(--line-strong); background: var(--surface-2); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt-letter {
  flex: none;
  width: 21px;
  height: 21px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
}
.opt-text { min-width: 0; font-size: 13.5px; line-height: 1.6; }
.opt.is-selected { border-color: var(--accent); background: var(--accent-soft); }
.opt.is-selected .opt-letter { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.opt.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-correct .opt-letter { border-color: var(--ok); background: var(--ok); color: var(--on-accent); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .opt-letter { border-color: var(--bad); background: var(--bad); color: var(--on-accent); }
.opt-tag { margin-left: auto; padding-left: 8px; color: var(--ok); font-size: 10px; white-space: nowrap; }
.opt:has(input:disabled) { cursor: default; }
.opt:has(input:disabled):hover { border-color: var(--line); background: var(--surface); }
.opt.is-correct:has(input:disabled):hover { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-wrong:has(input:disabled):hover { border-color: var(--bad); background: var(--bad-soft); }

.blanks { display: grid; gap: 9px; margin-top: 13px; }
.blank {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px 12px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}
.blank-label { flex: 1 1 180px; min-width: 0; color: var(--muted); font-size: 12.5px; }
.blank-field { display: flex; align-items: center; gap: 6px; }
.blank input {
  width: 120px;
  padding: 6px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}
.blank input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.blank input[readonly] { background: var(--surface-2); }
.unit { color: var(--muted); font-size: 11px; }
.blank.is-ok { border-color: var(--ok); }
.blank.is-bad { border-color: var(--bad); }
.blank-correct { flex-basis: 100%; color: var(--muted); font-family: var(--mono); font-size: 10.5px; }
.blank-correct::before { content: "→ "; }

.free {
  width: 100%;
  min-height: 128px;
  margin-top: 13px;
  padding: 11px 13px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.75;
  resize: vertical;
}
.free:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.free[readonly] { background: var(--surface-2); }

.q-feedback { margin-top: 15px; padding-top: 13px; border-top: 1px dashed var(--line-strong); }
.verdict {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
}
.verdict.correct { background: var(--ok-soft); color: var(--ok); }
.verdict.wrong { background: var(--bad-soft); color: var(--bad); }
.verdict.blank { background: var(--surface-2); color: var(--muted); }
.verdict.self { background: var(--accent-soft); color: var(--accent-ink); }
.answer-block, .explain-block { margin-top: 11px; min-width: 0; }
.answer-label {
  margin-bottom: 4px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.answer-text { font-size: 13.5px; line-height: 1.75; overflow-wrap: anywhere; }
.answer-block {
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  background: var(--surface);
}
.answer-block .answer-text { font-family: var(--serif); }
.answer-text code {
  padding: 1px 4px;
  border-radius: 4px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: .86em;
}
.explain-block { padding: 0 2px; }
.explain-block .answer-text { color: var(--muted); }

.selfgrade {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-top: 13px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}
.sg-label { color: var(--muted); font-size: 11px; }
.sg-btn {
  padding: 4px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--bg);
  color: var(--ink);
  font-size: 11.5px;
  cursor: pointer;
}
.sg-btn:hover { border-color: var(--accent); }
.sg-btn.is-on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.sg-hint { color: var(--muted); font-size: 10.5px; }

.module-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
.foot-link {
  padding: 4px 0;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 11.5px;
  cursor: pointer;
}
.foot-link:hover { color: var(--accent); }

.actionbar {
  position: sticky;
  bottom: 14px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 18px;
  margin-top: 28px;
  padding: 11px 15px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.ab-progress { flex: 1; min-width: 0; }
.ab-text {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.ab-bar { height: 4px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.ab-bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.ab-actions { flex: none; display: flex; gap: 8px; }
.btn {
  padding: 8px 15px;
  border: 1px solid transparent;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: var(--line-strong); background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.is-warn { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding-top: 20px; }
  .sidebar { display: none; }
  .mobile-picker { display: flex; }
  #main { max-width: none; }
  .header-side { gap: 10px; }
  .global-progress { width: 150px; }
}
@media (max-width: 640px) {
  .topbar-inner { gap: 12px; }
  .brand { gap: 8px; }
  .brand-kicker { display: none; }
  .brand h1 { font-size: 18px; }
  .global-progress { display: none; }
  .module-head h2 { font-size: 30px; }

  const STORAGE_KEY = "web3-quiz-v1";
  const THEME_KEY = "web3-quiz-theme";
  const view = document.getElementById("module-view");
  const nav = document.getElementById("module-nav");
  const select = document.getElementById("module-select");

  let state = loadState();
  let currentId = initialId();
  let themeMode = loadTheme();

  function loadState() {
    const empty = { last: "M0", modules: {} };
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return empty;
      const parsed = JSON.parse(raw);
      return {
        last: typeof parsed.last === "string" ? parsed.last : "M0",
        modules: parsed.modules && typeof parsed.modules === "object" ? parsed.modules : {}
      };
    } catch (e) {
      return empty;
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      /* 本地存储不可用时，页面仍可在内存中正常工作 */
    }
  }

  function loadTheme() {
    try {
      const t = localStorage.getItem(THEME_KEY);
      return t === "light" || t === "dark" ? t : "auto";
    } catch (e) {
      return "auto";
    }
  }

  function applyTheme() {
    if (themeMode === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", themeMode);
    const btn = document.getElementById("theme-btn");
    if (btn) {
      btn.textContent = themeMode === "auto" ? "主题：自动" : themeMode === "light" ? "主题：浅色" : "主题：深色";
    }
    try { localStorage.setItem(THEME_KEY, themeMode); } catch (e) {}
  }

  function moduleById(id) {
    return MODULES.find(m => m.id === id);
  }

  function initialId() {
    const h = (location.hash || "").replace(/^#/, "");
    if (moduleById(h)) return h;
    if (moduleById(state.last)) return state.last;
    return MODULES[0].id;
  }

  function ms(id) {
    if (!state.modules[id]) state.modules[id] = { answers: {}, submitted: false, grades: {} };
    const st = state.modules[id];
    if (!st.answers || typeof st.answers !== "object") st.answers = {};
    if (!st.grades || typeof st.grades !== "object") st.grades = {};
    return st;
  }

  function allQuestions(m) {
    return m.sections.flatMap(s => s.questions);
  }

  function escText(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function hasAnswer(q, a) {
    if (a === undefined || a === null) return false;
    if (q.type === "text") return String(a).trim().length > 0;
    if (q.type === "mcq") return Number.isInteger(a);
    if (q.type === "multi") return Array.isArray(a) && a.length > 0;
    if (q.type === "numeric") return Array.isArray(a) && a.some(v => String(v).trim() !== "");
    return false;
  }

  function num(v) {
    if (v === null || v === undefined) return NaN;
    let s = String(v).trim();
    s = s.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
    s = s.replace(/[．，]/g, m => (m === "．" ? "." : ","));
    s = s.replace(/[,，\s%％＄$]/g, "");
    if (!s) return NaN;
    const n = Number(s);
    return Number.isFinite(n) ? n : NaN;
  }

  function numericOK(q, ans) {
    return q.blanks.every((b, i) => {
      const v = num(ans ? ans[i] : undefined);
      return Number.isFinite(v) && Math.abs(v - b.value) <= (b.tol || 0);
    });
  }

  function autoVerdict(q, ans) {
    if (q.type === "text") return null;
    if (!hasAnswer(q, ans)) return "blank";
    if (q.type === "mcq") return ans === q.correct ? "correct" : "wrong";
    if (q.type === "multi") {
      const a = Array.isArray(ans) ? ans.slice().sort().join(",") : "";
      const b = q.correct.slice().sort().join(",");
      return a === b ? "correct" : "wrong";
    }
    if (q.type === "numeric") return numericOK(q, ans) ? "correct" : "wrong";
    return "blank";
  }

  function typeName(t) {
    return { mcq: "单选", multi: "多选", numeric: "计算", text: "简答" }[t] || t;
  }

  function letter(i) {
    return String.fromCharCode(65 + i);
  }

  function fmt(n) {
    if (!Number.isFinite(n)) return String(n);
    return String(Math.round(n * 1e6) / 1e6);
  }

  function scoreModule(m, st) {
    let earned = 0, total = 0, autoTotal = 0, autoCorrect = 0;
    let full = 0, half = 0, none = 0, ungraded = 0, blankAuto = 0;
    for (const q of allQuestions(m)) {
      total++;
      if (q.type === "text") {
        const g = st.grades[q.id];
        if (g === "full") { earned += 1; full++; }
        else if (g === "half") { earned += 0.5; half++; }
        else if (g === "none") { none++; }
        else ungraded++;
      } else {
        autoTotal++;
        const v = autoVerdict(q, st.answers[q.id]);
        if (v === "correct") { earned += 1; autoCorrect++; }
        if (v === "blank") blankAuto++;
      }
    }
    return {
      pct: total ? Math.round((earned / total) * 100) : 0,
      earned, total, autoTotal, autoCorrect, full, half, none, ungraded, blankAuto,
      textTotal: total - autoTotal
    };
  }

  function statusHTML(m) {
    const st = state.modules[m.id];
    if (!st || !st.submitted) {
      const hasAny = st && allQuestions(m).some(q => hasAnswer(q, st.answers[q.id]));
      return hasAny
        ? '<span class="dot is-progress" title="进行中"></span>'
        : '<span class="dot" title="未开始"></span>';
    }
    const s = scoreModule(m, st);
    const cls = s.pct >= 80 ? "good" : s.pct >= 60 ? "mid" : "low";
    return `<span class="pill ${cls}" title="本模块得分">${s.pct}</span>`;
  }

    const parts = [];

    for (const m of MODULES) {
      if (m.part !== lastPart) {
        if (lastPart !== null) parts.push("</div>");
        parts.push(`<div class="nav-group"><div class="nav-group-label">${m.part}</div>`);
        lastPart = m.part;

      parts.push(`<button class="nav-item ${m.id === currentId ? "is-active" : ""}" data-module-id="${m.id}" type="button"${m.id === currentId ? ' aria-current="page"' : ""}>
        <span class="nav-id">${m.id}</span>
        <span class="nav-title">${m.short}${m.draft ? '<span class="nav-draft">预</span>' : ""}</span>
        <span class="nav-status">${statusHTML(m)}</span>
      </button>`);
    }
    if (lastPart !== null) parts.push("</div>");
    nav.innerHTML = parts.join("");
  }

    if (!select) return;

    const done = MODULES.filter(m => state.modules[m.id] && state.modules[m.id].submitted).length;

  function moduleHeaderHTML(m) {

    const qs = allQuestions(m);

    const status = st && st.submitted ? `已批改 · ${scoreModule(m, st).pct} 分` : "未提交";

    return `<header class="module-head">

    const s = scoreModule(m, st);

      : "";
    const blankBit = s.blankAuto ? ` · ${s.blankAuto} 道自动题未作答` : "";
    return `<section class="score-card" id="score-card" aria-live="polite">
      <div class="seal" aria-hidden="true">已批改</div>
      <div class="score-body">
        <div class="score-line"><span class="score-num">${s.pct}</span><span class="score-den">/ 100</span></div>
        <p class="score-sub">自动题 ${s.autoCorrect}/${s.autoTotal} 答对${textBits}${blankBit}</p>
        <div class="score-bar"><span style="width:${s.pct}%"></span></div>
        <p class="score-note">${s.textTotal ? "简答题按自评计分；点击题目下的“答对 / 部分 / 未答对”可调整。" : "本模块全部为自动判分题。"}</p>
      </div>
    </section>`;
  }

  function optionHTML(q, i, st) {
    const ans = st.answers[q.id];
    const selected = q.type === "mcq" ? ans === i : (Array.isArray(ans) && ans.includes(i));
    const isCorrect = q.type === "mcq" ? q.correct === i : q.correct.includes(i);
    let cls = "opt";
    if (selected) cls += " is-selected";
    if (st.submitted && isCorrect) cls += " is-correct";
    if (st.submitted && selected && !isCorrect) cls += " is-wrong";
    const inputType = q.type === "mcq" ? "radio" : "checkbox";
    return `<label class="${cls}">
      <input type="${inputType}" name="${q.id}" value="${i}" ${selected ? "checked" : ""} ${st.submitted ? "disabled" : ""}>
      <span class="opt-letter">${letter(i)}</span>
      <span class="opt-text">${q.options[i]}</span>
      ${st.submitted && isCorrect ? '<span class="opt-tag">正确</span>' : ""}
    </label>`;
  }

  function numericAnswerHTML(q) {
    return q.blanks.map(b => `<div>${b.label} = <b>${fmt(b.value)}</b>${b.unit ? " " + b.unit : ""}</div>`).join("");
  }

  function mcqAnswerHTML(q) {
    return `<b>${letter(q.correct)}</b>．${q.options[q.correct]}`;
  }

  function multiAnswerHTML(q) {
    return q.correct.map(i => `<div><b>${letter(i)}</b>．${q.options[i]}</div>`).join("");
  }

  function selfGradeHTML(q, st) {
    const g = st.grades[q.id];
    const hint = g ? "" : '<span class="sg-hint">选择一项以计入得分</span>';
    return `<div class="selfgrade" data-qid="${q.id}">
      <span class="sg-label">自评</span>
      <button class="sg-btn ${g === "full" ? "is-on" : ""}" data-grade="full" type="button">答对</button>
      <button class="sg-btn ${g === "half" ? "is-on" : ""}" data-grade="half" type="button">部分</button>
      <button class="sg-btn ${g === "none" ? "is-on" : ""}" data-grade="none" type="button">未答对</button>
      ${hint}
    </div>`;
  }

  function feedbackHTML(q, st) {
    const ans = st.answers[q.id];
    let verdict;
    if (q.type === "text") {
      const g = st.grades[q.id];
      const label = g === "full" ? "自评：答对" : g === "half" ? "自评：部分" : g === "none" ? "自评：未答对" : "待自评";
      verdict = `<div class="verdict self">${label}</div>`;
    } else {
      const v = autoVerdict(q, ans);
      const map = {
        correct: ['correct', '✓ 答对'],
        wrong: ['wrong', '✗ 答错'],
        blank: ['blank', '— 未作答']
      };
      const [cls, text] = map[v] || map.blank;
      verdict = `<div class="verdict ${cls}">${text}</div>`;
    }
    let solution;
    if (q.type === "numeric") solution = numericAnswerHTML(q);
    else if (q.type === "mcq") solution = mcqAnswerHTML(q);
    else if (q.type === "multi") solution = multiAnswerHTML(q);
    else solution = q.solution;
    const answerBlock = `<div class="answer-block"><div class="answer-label">参考答案</div><div class="answer-text">${solution}</div></div>`;
    const explainBlock = q.type !== "text" && q.solution
      ? `<div class="explain-block"><div class="answer-label">解析</div><div class="answer-text">${q.solution}</div></div>`
      : "";
    const sg = q.type === "text" ? selfGradeHTML(q, st) : "";
    return `<div class="q-feedback">${verdict}${answerBlock}${explainBlock}${sg}</div>`;
  }

  function questionHTML(q, st) {
    let input = "";
    if (q.type === "mcq" || q.type === "multi") {
      input = `<fieldset class="opts"><legend class="sr-only">${q.type === "multi" ? "选择所有正确项" : "选择一项"}</legend>${q.options.map((_, i) => optionHTML(q, i, st)).join("")}</fieldset>`;
    } else if (q.type === "numeric") {
      input = `<div class="blanks">${q.blanks.map((b, i) => {
        const val = Array.isArray(st.answers[q.id]) ? st.answers[q.id][i] : "";
        const v = num(val);
        const ok = Number.isFinite(v) && Math.abs(v - b.value) <= (b.tol || 0);
        const stateCls = st.submitted ? (ok ? "is-ok" : "is-bad") : "";
        return `<label class="blank ${stateCls}">
          <span class="blank-label">${b.label}</span>
          <span class="blank-field">
            <input type="text" inputmode="decimal" data-blank="${i}" data-qid="${q.id}" value="${escText(val)}" placeholder="—" ${st.submitted ? "readonly" : ""}>
            <span class="unit">${b.unit || ""}</span>
          </span>
          ${st.submitted ? `<span class="blank-correct">正确：${fmt(b.value)}${b.unit ? " " + b.unit : ""}</span>` : ""}
        </label>`;
      }).join("")}</div>`;
    } else {
      input = `<textarea class="free" data-qid="${q.id}" rows="5" placeholder="写下你的答案，提交后可对照参考答案自评。" ${st.submitted ? "readonly" : ""}>${escText(st.answers[q.id] || "")}</textarea>`;
    }
    return `<article class="q" id="q-${q.id}" data-qid="${q.id}">
      <div class="q-label">${q.label}</div>
      <div class="q-main">
        <div class="q-meta">
          <span class="stars" aria-label="难度 ${q.stars} 星">${"★".repeat(q.stars)}</span>
          <span class="type-tag">${typeName(q.type)}</span>
        </div>
        <div class="q-prompt">${q.prompt}</div>
        ${input}
        ${st.submitted ? feedbackHTML(q, st) : ""}
      </div>
    </article>`;
  }

  function actionBarHTML(m, st, answered, total) {
    const resetLabel = st.submitted ? "重新作答" : "重置";
    return `<div class="actionbar" id="actionbar">
      <div class="ab-progress">
        <div class="ab-text"><span><span id="ans-count">${answered} / ${total}</span> 已作答</span><span>${st.submitted ? "已批改" : "提交后显示答案"}</span></div>
        <div class="ab-bar"><span id="ans-fill" style="width:${total ? (answered / total) * 100 : 0}%"></span></div>
      </div>
      <div class="ab-actions">
        <button class="btn ghost" id="reset-btn" type="button">${resetLabel}</button>
        <button class="btn primary" id="submit-btn" type="button" ${st.submitted ? "disabled" : ""}>${st.submitted ? "已提交" : "提交本模块"}</button>
      </div>
    </div>`;
  }

  function moduleFootHTML(m) {
    const idx = MODULES.findIndex(x => x.id === m.id);
    const prev = MODULES[idx - 1];
    const next = MODULES[idx + 1];
    return `<div class="module-foot">
      ${prev ? `<button class="foot-link" data-go="${prev.id}" type="button">← ${prev.id} ${prev.short}</button>` : "<span></span>"}
      ${next ? `<button class="foot-link" data-go="${next.id}" type="button">${next.id} ${next.short} →</button>` : "<span></span>"}
    </div>`;
  }

  function renderModule(id, opts = {}) {
    const m = moduleById(id);
    if (!m) return;
    currentId = id;
    state.last = id;
    save();
    const st = ms(id);
    const qs = allQuestions(m);
    const answered = qs.filter(q => hasAnswer(q, st.answers[q.id])).length;
    view.innerHTML = moduleHeaderHTML(m)
      + (st.submitted ? scoreCardHTML(m, st) : "")
      + m.sections.map(sec => `<section class="section">
          <div class="section-head"><h3>${sec.title}</h3><span>${sec.questions.length} 题</span></div>
          ${sec.questions.map(q => questionHTML(q, st)).join("")}
        </section>`).join("")
      + moduleFootHTML(m)
      + actionBarHTML(m, st, answered, qs.length);
    renderSidebar();
    updateMobileSelect();
    updateGlobalProgress();
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* file:// 可能拒绝改 URL */ }
    if (opts.scroll === "top") scrollTop();
    if (opts.scroll === "score") {
      const card = document.getElementById("score-card");
      if (card) card.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
    }
  }

  function reduceMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function scrollTop() {
    window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" });
  }

  function go(id) {
    if (!moduleById(id)) return;
    if (id === currentId) { scrollTop(); return; }
    currentId = id;
    state.last = id;
    save();
    renderModule(id, { scroll: "top" });
  }

  function submitModule() {
    const st = ms(currentId);
    if (st.submitted) return;
    st.submitted = true;
    save();
    renderModule(currentId, { scroll: "score" });
  }

  function updateAnswerProgress() {
    const m = moduleById(currentId);
    const st = ms(currentId);
    const qs = allQuestions(m);
    const n = qs.filter(q => hasAnswer(q, st.answers[q.id])).length;
    const count = document.getElementById("ans-count");
    const fill = document.getElementById("ans-fill");
    if (count) count.textContent = `${n} / ${qs.length}`;
    if (fill) fill.style.width = `${qs.length ? (n / qs.length) * 100 : 0}%`;
  }

  function updateScoreCard() {
    const card = document.getElementById("score-card");
    if (!card) return;
    card.outerHTML = scoreCardHTML(moduleById(currentId), ms(currentId));
  }

  function handleInput(e) {
    const t = e.target;
    if (!t || !t.matches) return;
    const st = ms(currentId);
    if (t.matches("textarea[data-qid]")) {
      st.answers[t.dataset.qid] = t.value;
    } else if (t.matches("input[data-blank]")) {
      const qid = t.dataset.qid;
      const arr = Array.isArray(st.answers[qid]) ? st.answers[qid].slice() : [];
      arr[Number(t.dataset.blank)] = t.value;
      st.answers[qid] = arr;
    } else if (t.matches('input[type="radio"]')) {
      st.answers[t.name] = Number(t.value);
    } else if (t.matches('input[type="checkbox"]')) {
      const checked = [...view.querySelectorAll(`input[name="${CSS.escape(t.name)}"]:checked`)].map(x => Number(x.value));
      st.answers[t.name] = checked;
    } else {
      return;
    }
    save();
    updateAnswerProgress();
    updateNavStatus(currentId);
  }

  function handleReset(btn) {
    if (btn.dataset.armed !== "1") {
      btn.dataset.armed = "1";
      btn.dataset.original = btn.textContent;
      btn.textContent = "确认重新作答？";
      btn.classList.add("is-warn");
      setTimeout(() => {
        if (btn.isConnected) {
          btn.dataset.armed = "0";
          btn.textContent = btn.dataset.original;
          btn.classList.remove("is-warn");
        }
      }, 3200);
      return;
    }
    delete state.modules[currentId];
    save();
    renderModule(currentId, { scroll: "top" });
  }

  function handleSelfGrade(btn) {
    const st = ms(currentId);
    const group = btn.closest(".selfgrade");
    if (!group) return;
    const qid = group.dataset.qid;
    const grade = btn.dataset.grade;
    if (st.grades[qid] === grade) delete st.grades[qid];
    else st.grades[qid] = grade;
    save();
    group.querySelectorAll(".sg-btn").forEach(b => {
      b.classList.toggle("is-on", st.grades[qid] === b.dataset.grade);
    });
    const qEl = document.getElementById("q-" + qid);
    const verdict = qEl ? qEl.querySelector(".q-feedback .verdict") : null;
    if (verdict) {
      verdict.textContent = st.grades[qid] === "full" ? "自评：答对"
        : st.grades[qid] === "half" ? "自评：部分"
        : st.grades[qid] === "none" ? "自评：未答对"
        : "待自评";
    }
    const hint = group.querySelector(".sg-hint");
    if (st.grades[qid]) {
      if (hint) hint.remove();
    } else if (!hint) {
      const span = document.createElement("span");
      span.className = "sg-hint";
      span.textContent = "选择一项以计入得分";
      group.appendChild(span);
    }
    updateScoreCard();
    updateNavStatus(currentId);
    updateGlobalProgress();
  }

  nav.addEventListener("click", e => {
    const btn = e.target.closest(".nav-item");
    if (btn && btn.dataset.moduleId) go(btn.dataset.moduleId);
  });

  view.addEventListener("click", e => {
    if (e.target.closest("#submit-btn")) { submitModule(); return; }
    if (e.target.closest("#reset-btn")) { handleReset(e.target.closest("#reset-btn")); return; }
    if (e.target.closest(".sg-btn")) { handleSelfGrade(e.target.closest(".sg-btn")); return; }
    const goBtn = e.target.closest("[data-go]");
    if (goBtn) go(goBtn.dataset.go);
  });

  view.addEventListener("input", handleInput);
  view.addEventListener("change", handleInput);

  select.addEventListener("change", e => go(e.target.value));

  document.getElementById("theme-btn").addEventListener("click", () => {
    themeMode = themeMode === "auto" ? "light" : themeMode === "light" ? "dark" : "auto";
    applyTheme();
  });

  document.getElementById("clear-all").addEventListener("click", function () {
    if (this.dataset.armed !== "1") {
      this.dataset.armed = "1";
      this.dataset.original = this.textContent;
      this.textContent = "确认清空全部记录？";
      setTimeout(() => {
        if (this.isConnected) {
          this.dataset.armed = "0";
          this.textContent = this.dataset.original;
        }
      }, 3200);
      return;
    }
    this.dataset.armed = "0";
    this.textContent = this.dataset.original;
    state = { last: "M0", modules: {} };
    save();
    renderModule("M0", { scroll: "top" });
  });

  window.addEventListener("hashchange", () => {
    const h = (location.hash || "").replace(/^#/, "");
    if (moduleById(h) && h !== currentId) renderModule(h, { scroll: "top" });
  });

  applyTheme();
  renderModule(initialId(), { scroll: "top" });
})();
</script>
</body>
</html>
